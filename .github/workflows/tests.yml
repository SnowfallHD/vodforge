name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r engineering-quality/requirements.txt
      - name: Install media test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install media test tools (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install media test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install_ffmpeg_windows.ps1
      - name: Compile source
        run: python -m compileall -q yt_downloader main.py
      - name: Run tests
        run: python -m pytest -q
      - name: Execute Windows updater fault cases
        if: runner.os == 'Windows'
        run: python -m pytest engineering-quality/tests/test_update_handoff_runtime.py -q
