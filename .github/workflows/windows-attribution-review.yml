name: Windows attribution artifact review

on:
  push:
    branches:
      - codex/heycatch-native-attribution
    paths:
      - .github/workflows/windows-attribution-review.yml

permissions:
  contents: read

jobs:
  artifact-matrix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          .\install_ffmpeg_windows.ps1
          .\install_deno_windows.ps1
      - name: Build installer and portable artifacts
        shell: pwsh
        run: .\build_and_package_windows.ps1 -Version "0.1.8-dev"
      - name: Exercise fresh installer and portable first launches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $results = @()

          function Read-InstallationState([string]$Path) {
            if (-not (Test-Path $Path)) { return $null }
            try { return Get-Content -Raw $Path | ConvertFrom-Json } catch { return $null }
          }

          function Wait-ForState([string]$Path, [scriptblock]$Accept, [int]$Seconds) {
            $deadline = (Get-Date).AddSeconds($Seconds)
            do {
              $state = Read-InstallationState $Path
              if ($state -and (& $Accept $state)) { return $state }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            return Read-InstallationState $Path
          }

          function Complete-ClaimInHeadlessEdge([string]$ClaimToken, [string]$Profile) {
            $edgeCandidates = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
            )
            $edge = $edgeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge is unavailable for deterministic claim completion" }
            New-Item -ItemType Directory -Force -Path $Profile | Out-Null
            $claimUrl = "https://getvodforge.com/claim#token=$ClaimToken"
            & $edge --headless=new --disable-gpu --no-first-run --user-data-dir=$Profile --virtual-time-budget=15000 --dump-dom $claimUrl | Out-Null
          }

          function Stop-TestApp($Process) {
            if (-not $Process -or $Process.HasExited) { return }
            [void]$Process.CloseMainWindow()
            if (-not $Process.WaitForExit(5000)) {
              Stop-Process -Id $Process.Id -Force
              $Process.WaitForExit()
            }
          }

          function Invoke-FreshFirstLaunch([string]$Name, [string]$Executable) {
            $caseRoot = Join-Path $env:RUNNER_TEMP "vodforge-attribution-$Name"
            $localData = Join-Path $caseRoot "LocalAppData"
            $roamingData = Join-Path $caseRoot "AppData"
            $profile = Join-Path $caseRoot "Profile"
            $temp = Join-Path $caseRoot "Temp"
            New-Item -ItemType Directory -Force -Path $localData, $roamingData, $profile, $temp | Out-Null
            $env:LOCALAPPDATA = $localData
            $env:APPDATA = $roamingData
            $env:USERPROFILE = $profile
            $env:TEMP = $temp
            $env:TMP = $temp
            $statePath = Join-Path $localData "VODForge\installation.json"
            $process = Start-Process -FilePath $Executable -PassThru
            try {
              $opened = Wait-ForState $statePath {
                param($state)
                $state.attribution_claim_opened -eq $true -or $state.heycatch_first_launch_confirmed -eq $true
              } 25
              if (-not $opened) { throw "$Name did not create installation state" }

              $confirmed = Wait-ForState $statePath {
                param($state)
                $state.heycatch_first_launch_confirmed -eq $true
              } 15
              $completion = "native-browser"
              if (-not $confirmed -or $confirmed.heycatch_first_launch_confirmed -ne $true) {
                if (-not $opened.attribution_claim_token) { throw "$Name did not retain a claim token for recovery" }
                Complete-ClaimInHeadlessEdge $opened.attribution_claim_token (Join-Path $caseRoot "Edge")
                $completion = "headless-browser-recovery"
                $confirmed = Wait-ForState $statePath {
                  param($state)
                  $state.heycatch_first_launch_confirmed -eq $true
                } 55
              }
              if (
                -not $confirmed -or
                $confirmed.first_launch_confirmed -ne $true -or
                $confirmed.attribution_claim_opened -ne $true -or
                $confirmed.attribution_claim_confirmed -ne $true -or
                $confirmed.heycatch_first_launch_confirmed -ne $true -or
                $confirmed.attribution_claim_token
              ) {
                throw "$Name did not finish the first-launch attribution contract: $($confirmed | ConvertTo-Json -Compress)"
              }
              $script:results += [ordered]@{
                artifact = $Name
                install_id = $confirmed.install_id
                completion = $completion
                first_launch_confirmed = $confirmed.first_launch_confirmed
                attribution_claim_confirmed = $confirmed.attribution_claim_confirmed
                heycatch_first_launch_confirmed = $confirmed.heycatch_first_launch_confirmed
              }
            } finally {
              Stop-TestApp $process
            }
          }

          $installer = Resolve-Path ".\dist\release\VODForge-Windows-Setup-v0.1.8-dev.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "VODForge-Installed"
          $installerProcess = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installRoot"
          ) -PassThru -Wait
          if ($installerProcess.ExitCode -ne 0) { throw "Installer exited with $($installerProcess.ExitCode)" }
          Invoke-FreshFirstLaunch "windows-installer" (Join-Path $installRoot "VODForge.exe")

          $portableRoot = Join-Path $env:RUNNER_TEMP "VODForge-Portable"
          Expand-Archive ".\dist\release\VODForge-Windows-Portable-v0.1.8-dev.zip" $portableRoot -Force
          $portableExe = Get-ChildItem $portableRoot -Recurse -Filter "VODForge.exe" | Select-Object -First 1
          if (-not $portableExe) { throw "Portable archive did not contain VODForge.exe" }
          Invoke-FreshFirstLaunch "windows-portable" $portableExe.FullName

          $matrixPath = ".\dist\release\windows-attribution-matrix.json"
          $results | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $matrixPath
          Get-Content $matrixPath
      - uses: actions/upload-artifact@v4
        with:
          name: vodforge-windows-attribution-review
          path: dist/release/*
          if-no-files-found: error
