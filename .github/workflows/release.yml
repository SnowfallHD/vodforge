name: Build Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix, for example 1.2.3
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install bundled runtimes
        shell: pwsh
        run: |
          .\install_ffmpeg_windows.ps1
          .\install_vlc_windows.ps1
          .\install_deno_windows.ps1
      - name: Build Windows application
        shell: pwsh
        env:
          VODFORGE_BUILD_VERSION: ${{ inputs.version }}
          VODFORGE_BUILD_TELEMETRY: production
        run: .\build_windows.ps1
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign packaged Windows application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\VODForge\VODForge.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VODForge
          description-url: https://github.com/SnowfallHD/vodforge
      - name: Verify packaged Windows application signatures
        shell: pwsh
        run: .\verify_windows_signatures.ps1 -Files @("${{ github.workspace }}\dist\VODForge\VODForge.exe")
      - name: Smoke-test signed Windows application
        shell: pwsh
        env:
          VODFORGE_DISABLE_TELEMETRY: "1"
        run: |
          $smoke = Start-Process "$PWD\dist\VODForge\VODForge.exe" -ArgumentList '--runtime-smoke' -PassThru
          if (!$smoke.WaitForExit(120000)) { throw 'Signed application runtime smoke timed out' }
          $smoke.Refresh()
          if ($smoke.ExitCode -ne 0) { throw ('Signed application runtime smoke failed: ' + $smoke.ExitCode) }
      - name: Build Windows installer
        shell: pwsh
        run: .\build_windows_installer.ps1 -Version "${{ inputs.version }}"
      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\release\VODForge-Windows-Setup-v${{ inputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: VODForge Installer
          description-url: https://github.com/SnowfallHD/vodforge
      - name: Verify installer and package signed portable application
        shell: pwsh
        run: |
          $installer = "${{ github.workspace }}\dist\release\VODForge-Windows-Setup-v${{ inputs.version }}.exe"
          .\verify_windows_signatures.ps1 -Files @($installer)
          Compress-Archive -Path .\dist\VODForge -DestinationPath ".\dist\release\VODForge-Windows-Portable-v${{ inputs.version }}.zip" -Force
      - name: Execute Windows updater fault cases
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest engineering-quality/tests/test_update_handoff_runtime.py -q
      - name: Verify running Windows upgrade before publishing artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baselineDir = "$PWD\build\update-baseline"
          gh release download --repo SnowfallHD/vodforge --pattern 'VODForge-Windows-Setup-*.exe' --dir $baselineDir
          if ($LASTEXITCODE -ne 0) { throw 'No published baseline installer available for upgrade proof' }
          $baseline = @(Get-ChildItem $baselineDir -Filter *.exe)
          if ($baseline.Count -ne 1) { throw 'Expected exactly one baseline installer' }
          .\engineering-quality\runners\windows-update-qa.ps1 -BaselineInstaller $baseline[0].FullName -CandidateInstaller "$PWD\dist\release\VODForge-Windows-Setup-v${{ inputs.version }}.exe" -CandidateExecutable "$PWD\dist\VODForge\VODForge.exe" -SourceRoot "$PWD" -Python "$PWD\.venv\Scripts\python.exe" -OutputDirectory "$PWD\build\update-journeys"
          .\engineering-quality\runners\windows-update-qa.ps1 -BaselineInstaller $baseline[0].FullName -CandidateInstaller "$PWD\dist\release\VODForge-Windows-Setup-v${{ inputs.version }}.exe" -CandidateExecutable "$PWD\dist\VODForge\VODForge.exe" -SourceRoot "$PWD" -Python "$PWD\.venv\Scripts\python.exe" -OutputDirectory "$PWD\build\update-journeys" -LegacyHandoff
      - name: Preserve Windows update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-evidence
          path: |
            build/update-journeys/**/update-journey.json
            dist/release/handoff-*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: vodforge-windows
          path: |
            dist/release/*.exe
            dist/release/*.zip
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          if ! brew install python@3.13 python-tk@3.13 ffmpeg deno; then
            for formula in python@3.13 python-tk@3.13 ffmpeg deno; do
              brew list --versions "$formula" >/dev/null
            done
          fi
          ./install_vlc_macos.sh
          echo "$(brew --prefix python@3.13)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix ffmpeg)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix deno)/bin" >> "$GITHUB_PATH"
      - name: Build unsigned macOS review application
        env:
          VODFORGE_UNSIGNED_REVIEW: "1"
          VODFORGE_BUILD_TELEMETRY: production
        run: ./build_and_package_macos.sh "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vodforge-macos-${{ matrix.architecture }}-unsigned
          path: dist/release/*
          if-no-files-found: error

  draft:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: vodforge-*
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | while read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
      - name: Create review-only draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/render_release_notes.py "${{ inputs.version }}" --draft > release-notes.md
          gh release create "v${{ inputs.version }}" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "VODForge v${{ inputs.version }}" \
            --notes-file release-notes.md \
            --draft
