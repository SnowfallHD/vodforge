name: Exactc668 signed Intel artifact verification
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Unpublished QA asset ID containing the already signed exactc6684b2 archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-existing-signed-intel:
    permissions:
      contents: write
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing unpublished archive by asset ID
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
        run: |
          [[ "$ASSET_ID" =~ ^[0-9]+$ ]]
          mkdir evidence
          gh api repos/SnowfallHD/vodforge/releases/400362406 > evidence/draft.json
          python3 -c 'import json; d=json.load(open("evidence/draft.json")); assert d["id"] == 400362406 and d["draft"] is True; print("Unpublished QA draft verified")'
          gh api "repos/SnowfallHD/vodforge/releases/assets/$ASSET_ID" > evidence/asset.json
          python3 -c 'import json; d=json.load(open("evidence/asset.json")); assert d["name"] == "QA-ONLY-exactc6684b2-VODForge-macOS-x64-signed.zip" and d["state"] == "uploaded"'
          gh api "repos/SnowfallHD/vodforge/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/exactc6684b2-signed.zip"
      - name: Verify signatures, artifact identity and maintained runtime smoke
        run: python3 .github/scripts/verify_signed_intel_artifact.py "$RUNNER_TEMP/exactc6684b2-signed.zip" evidence
      - name: Retain bounded verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exactc6684b2-signed-intel-verification
          path: evidence/
          retention-days: 14
          if-no-files-found: error
