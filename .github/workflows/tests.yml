name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r engineering-quality/requirements.txt
      - name: Install media test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install media test tools (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install media test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\install_ffmpeg_windows.ps1
          "$PWD\vendor\ffmpeg\bin" >> $env:GITHUB_PATH
          "QT_QPA_FONTDIR=$env:WINDIR\Fonts" >> $env:GITHUB_ENV
      - name: Compile source
        run: python -m compileall -q yt_downloader main.py
      - name: Run backend tests without Qt renderer modules
        env:
          QT_QUICK_BACKEND: software
        run: >-
          python -m pytest -q
          --ignore=tests/test_qt_artwork_image.py
          --ignore=tests/test_qt_metadata_preview.py
          --ignore=tests/test_qt_presentation_diagnostics.py
          --ignore=tests/test_qt_previews.py
          --ignore=tests/test_qt_quality_e2e.py
          --ignore=tests/test_qt_relink.py
          --ignore=tests/test_qt_terminal_item_events.py
          --ignore=tests/test_qt_scene_port.py
      - name: Run Qt component tests in a fresh process
        env:
          QT_QUICK_BACKEND: software
        run: >-
          python -m pytest -q
          tests/test_qt_artwork_image.py
          tests/test_qt_metadata_preview.py
          tests/test_qt_presentation_diagnostics.py
          tests/test_qt_previews.py
          tests/test_qt_quality_e2e.py
          tests/test_qt_relink.py
          tests/test_qt_terminal_item_events.py
      - name: Run Qt scene tests in a fresh process
        env:
          QT_QUICK_BACKEND: software
        run: python -m pytest -q tests/test_qt_scene_port.py
      - name: Execute Windows updater fault cases
        if: runner.os == 'Windows'
        run: python -m pytest engineering-quality/tests/test_update_handoff_runtime.py -q
