name: Exact26 signed Windows startup diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe-existing-signed-binary:
    # Existing release workflow ceiling; draft assets require this read access.
    # No OIDC, new credentials, build, sign, install or publication operation.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install existing maintained diagnostic dependencies
        run: python -m pip install -r requirements-dev.txt -r engineering-quality/requirements.txt
      - name: Fetch only the verified existing unpublished diagnostic artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/SnowfallHD/vodforge/releases/400362406 > "$RUNNER_TEMP/draft.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/draft.json")); assert d["id"]==400362406 and d["draft"] is True'
          gh api repos/SnowfallHD/vodforge/releases/assets/603419262 > "$RUNNER_TEMP/asset.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/asset.json")); assert d["name"]=="QA-ONLY-exact26-Windows-signed-diagnostic.zip" and d["digest"]=="sha256:4e360cec678b958fea99c1e75ae7ffb7bade3402043580840aebc59b84bb5dac" and d["state"]=="uploaded"'
          gh api repos/SnowfallHD/vodforge/releases/assets/603419262 -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/exact26.zip"
      - name: Observe ready-file and native window startup, direct and hidden helper
        shell: pwsh
        run: python .github/scripts/diagnose_signed_windows_startup.py "$env:RUNNER_TEMP/exact26.zip" "$env:RUNNER_TEMP/startup-evidence"
      - name: Preserve startup identity, timing, window and normal-close receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact26-signed-windows-startup-diagnosis
          path: |
            ${{ runner.temp }}/startup-evidence/diagnostic-receipt.json
            ${{ runner.temp }}/startup-evidence/signature.log
            ${{ runner.temp }}/startup-evidence/*/samples.json
            ${{ runner.temp }}/startup-evidence/*/ready.json
          retention-days: 14
          if-no-files-found: error
