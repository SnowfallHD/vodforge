name: Remaining Windows Python 3.11 checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python311:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing test dependencies
        run: python -m pip install -r requirements-dev.txt -r engineering-quality/requirements.txt
      - name: Install media test tools
        shell: pwsh
        run: |
          .\install_ffmpeg_windows.ps1
          "QT_QPA_FONTDIR=$env:WINDIR\Fonts" >> $env:GITHUB_ENV
          "$PWD\vendor\ffmpeg\bin" >> $env:GITHUB_PATH
      - name: Recheck the failed artwork subprocess with preserved diagnostics
        env:
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python -m pytest -q tests/test_qt_artwork_continuity.py --basetemp=artwork-probe-evidence
      - name: Run the previously skipped scene tests
        env:
          QT_QUICK_BACKEND: software
          QT_QUICK_CONTROLS_STYLE: Basic
        run: python -m pytest -q tests/test_qt_scene_port.py
      - name: Run the previously skipped updater fault cases
        run: python -m pytest -q engineering-quality/tests/test_update_handoff_runtime.py engineering-quality/tests/test_windows_update_visibility.py engineering-quality/tests/test_windows_update_diagnostics.py
      - name: Retain original artwork child diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python311-artwork-probe
          path: artwork-probe-evidence
          if-no-files-found: warn
