name: Reflow timeout phase diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve diagnostic-only runner outside source
        shell: bash
        run: |
          cp .github/scripts/reflow_phase_probe.py "$RUNNER_TEMP/phase-probe.py"
          cp .github/scripts/run_reflow_diagnostics.py "$RUNNER_TEMP/run-diagnostics.py"
      - uses: actions/checkout@v4
        with:
          ref: 85068cedb4babe5302a51d1f035f473f8777cd84
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install existing maintained test dependencies
        run: python -m pip install -r requirements-dev.txt -r engineering-quality/requirements.txt
      - name: Use existing Windows font directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"QT_QPA_FONTDIR=$env:WINDIR\Fonts" >> $env:GITHUB_ENV'
      - name: Measure fixture/import/render/teardown with unchanged pixel assertions
        shell: bash
        run: python "$RUNNER_TEMP/run-diagnostics.py" "$RUNNER_TEMP/phase-probe.py" "$RUNNER_TEMP/reflow-evidence"
      - name: Retain phase evidence and negative controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflow-phase-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/reflow-evidence/summary.json
            ${{ runner.temp }}/reflow-evidence/*/phases.jsonl
            ${{ runner.temp }}/reflow-evidence/*/proof.json
            ${{ runner.temp }}/reflow-evidence/*/*.log
            ${{ runner.temp }}/reflow-evidence/*/*.png
          if-no-files-found: error
          retention-days: 14
